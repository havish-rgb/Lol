name: Build JARVIS APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unzip any zip in repo
        run: find . -maxdepth 2 -name '*.zip' -not -path './.git/*' -exec unzip -qo {} -d extracted \;

      - name: Find project
        id: p
        run: echo "dir=$(dirname "$(find . -name 'settings.gradle*' -not -path './.git/*' | head -n1)")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: cd "${{ steps.p.outputs.dir }}" && gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
